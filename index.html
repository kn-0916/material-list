<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>材料リスト制作サイト</title>
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="材料リスト">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3f7530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg: #f6f7f0;
    --panel: #ffffff;
    --panel-2: #eef1e3;
    --slot: #f1f2ea;
    --slot-border-light: #c9cdb8;
    --slot-border-dark: #9a9f89;
    --grass: #5a9a44;
    --grass-dark: #3f7530;
    --wood: #a97c46;
    --gold: #b5860f;
    --text: #262b1f;
    --text-dim: #6c7160;
    --danger: #b8503f;
    --sl-color: #a5760a;
    --st-color: #2472a4;
    --ea-color: #262b1f;
    --val-zero: #b3b7a4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #e7ecd9 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #eef1e3 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  a{color:inherit;}

  header{
    position:relative;
    overflow:hidden;
    padding:44px 24px 28px;
    text-align:center;
    border-bottom:4px solid var(--grass-dark);
    background:linear-gradient(180deg, #ffffff 0%, #eef1e3 100%);
  }
  header h1{
    position:relative;
    z-index:1;
    font-family:'DotGothic16', monospace;
    font-size:clamp(22px, 4vw, 40px);
    letter-spacing:2px;
    margin:0 0 12px;
    color:var(--grass-dark);
    text-shadow: 2px 2px 0 #cdd6bb;
  }
  header .count-badge{
    position:relative;
    z-index:1;
    display:inline-block;
    margin-top:16px;
    padding:6px 16px;
    background:var(--panel-2);
    border:2px solid var(--slot-border-light);
    border-radius:2px;
    font-size:13px;
    color:var(--text);
  }
  header .count-badge b{color:var(--grass-dark);}

  .falling-items{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }
  .falling-item{
    position:absolute;
    top:-40px;
    image-rendering:pixelated;
    opacity:0;
    will-change:transform, opacity;
    animation-name:itemFall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.12));
  }
  @keyframes itemFall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.85; }
    92%{ opacity:0.85; }
    100%{ transform:translateY(var(--fall-distance, 220px)) rotate(300deg); opacity:0; }
  }

  .controlbar{
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,255,255,0.96);
    backdrop-filter: blur(4px);
    border-bottom:3px solid var(--grass-dark);
    padding:14px 20px;
  }
  .controlbar-inner{
    max-width:1320px;
    margin:0 auto;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
  }
  .search-wrap{
    position:relative;
    flex:1 1 280px;
    min-width:220px;
  }
  .search-wrap input[type="text"]{
    width:100%;
    padding:11px 34px 11px 14px;
    font-size:15px;
    font-family:'Noto Sans JP', sans-serif;
    background:var(--slot);
    color:var(--text);
    border:2px solid var(--slot-border-dark);
    box-shadow: inset 2px 2px 0 rgba(0,0,0,0.08);
    border-radius:2px;
    outline:none;
  }
  .search-wrap input[type="text"]:focus{
    border-color: var(--gold);
  }
  .search-clear-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    border:none;
    border-radius:50%;
    background:var(--panel-2);
    color:var(--text-dim);
    font-size:15px;
    line-height:1;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .search-clear-btn:hover{background:var(--danger); color:#fff;}
  .search-wrap .hint{
    font-size:11px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .suggest-list{
    position:absolute;
    top:calc(100% + 4px);
    left:0;
    right:0;
    background:var(--panel-2);
    border:2px solid var(--slot-border-light);
    border-radius:2px;
    box-shadow:0 8px 20px rgba(60,60,40,0.18);
    max-height:320px;
    overflow-y:auto;
    z-index:50;
    display:none;
  }
  .suggest-list.open{display:block;}
  .suggest-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    cursor:pointer;
    border-bottom:1px solid #e4e7d8;
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover, .suggest-item.active{background:var(--grass-dark);}
  .suggest-item:hover .s-ja, .suggest-item.active .s-ja,
  .suggest-item:hover .s-en, .suggest-item.active .s-en{color:#fff;}
  .suggest-item img{width:24px;height:24px;image-rendering:pixelated;flex-shrink:0;}
  .suggest-item .s-ja{font-size:14px;}
  .suggest-item .s-en{font-size:11px;color:var(--text-dim);margin-left:auto;}

  .btn{
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    font-weight:700;
    padding:10px 16px;
    border-radius:2px;
    border:2px solid var(--slot-border-dark);
    cursor:pointer;
    color:#1c1f1a;
    background:var(--grass);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.35), inset -2px -2px 0 rgba(0,0,0,0.15);
    transition: transform .05s ease;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:var(--wood); color:#20170a;}
  .btn.ghost{background:var(--panel-2); color:var(--text); border-color:var(--slot-border-light);}
  .btn.danger{background:var(--danger); color:#2a0e08;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.full{width:100%;}
  .btn.small{padding:8px 10px; font-size:12px;}

  .toggle-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--text-dim);
    user-select:none;
    cursor:pointer;
  }
  .toggle-wrap input{width:16px;height:16px;accent-color:var(--grass);}

  main{max-width:1320px; margin:0 auto; padding:22px 16px 80px;}
  .layout{
    display:flex;
    gap:20px;
    align-items:flex-start;
  }
  .catalog-col{flex:1; min-width:0;}
  .sidebar-col{
    width:320px;
    flex-shrink:0;
  }

  .table-shell{
    background:var(--panel);
    border:3px solid var(--slot-border-dark);
    border-radius:3px;
    overflow:auto;
    max-height:74vh;
  }
  table{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    font-size:13.5px;
  }
  .col-img{width:56px;}
  .col-name{width:auto;}
  .col-qty{width:86px;}
  .col-sl{width:62px;}
  .col-st{width:62px;}
  .col-ea{width:62px;}
  thead th{
    position:sticky;
    top:0;
    background:var(--grass-dark);
    color:#f2ffe9;
    font-family:'DotGothic16', monospace;
    letter-spacing:1px;
    font-weight:400;
    font-size:13px;
    padding:10px 8px;
    text-align:center;
    border-bottom:3px solid #3a5c2c;
    z-index:20;
  }
  thead th.th-name{text-align:left; padding-left:14px;}
  tbody tr{
    border-bottom:1px solid #e6e9da;
    background:var(--panel);
  }
  tbody tr:nth-child(even){background:#f7f8f1;}
  tbody tr:hover{background:#e6edd8;}
  tbody tr.has-qty{background:#eef3df;}
  tbody tr.has-qty:nth-child(even){background:#e6edd0;}
  td{padding:7px 8px; text-align:center; vertical-align:middle;}
  td.td-name{text-align:left; padding-left:14px;}

  .slot{
    width:36px; height:36px;
    background:#8b8b8b;
    border:2px solid;
    border-color:#373737 #d8d8d8 #d8d8d8 #373737;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto;
    border-radius:1px;
    flex-shrink:0;
    cursor:pointer;
  }
  .slot:hover{box-shadow:0 0 0 2px var(--grass);}
  .slot.slot-added-flash{box-shadow:0 0 0 2px var(--grass-dark); background:#a8d999;}
  .slot img{
    width:28px; height:28px;
    image-rendering:pixelated;
  }
  .item-name .ja{display:block; font-size:13.5px;}
  .item-name .en{display:block; font-size:10.5px; color:var(--text-dim);}

  input.qty-input{
    width:70px;
    padding:6px 4px;
    text-align:center;
    background:var(--slot);
    color:var(--text);
    border:2px solid var(--slot-border-dark);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.08);
    border-radius:2px;
    font-size:13px;
    -moz-appearance: textfield;
  }
  input.qty-input::-webkit-outer-spin-button,
  input.qty-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  input.qty-input:focus{outline:none; border-color:var(--gold);}

  .val-sl{color:var(--sl-color); font-weight:700;}
  .val-st{color:var(--st-color); font-weight:700;}
  .val-ea{color:var(--ea-color);}
  .val-zero{color:var(--val-zero);}

  .empty-row td{padding:40px; text-align:center; color:var(--text-dim); font-size:14px;}

  .sidebar{
    background:var(--panel);
    border:3px solid var(--slot-border-dark);
    border-radius:3px;
    padding:14px;
    transition: box-shadow .1s ease;
  }
  .sidebar h2{
    margin:0 0 4px;
    font-family:'DotGothic16', monospace;
    font-size:16px;
    color:var(--grass-dark);
    letter-spacing:1px;
  }
  .sidebar .sub{
    font-size:11.5px;
    color:var(--text-dim);
    margin-bottom:10px;
  }
  .sidebar-list{
    max-height:48vh;
    overflow-y:auto;
    border:2px solid var(--slot-border-light);
    border-radius:2px;
    background:var(--slot);
  }
  .sidebar-empty{
    padding:26px 12px;
    text-align:center;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .sidebar-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    border-bottom:1px solid #e2e5d3;
    background:var(--panel);
    cursor:grab;
  }
  .sidebar-row.dragging{
    opacity:0.4;
  }
  .sidebar-row.drag-over-top{
    box-shadow: inset 0 2px 0 var(--grass-dark);
  }
  .sidebar-row.drag-over-bottom{
    box-shadow: inset 0 -2px 0 var(--grass-dark);
  }
  .sidebar-row .sr-grip{
    flex-shrink:0;
    width:14px;
    text-align:center;
    color:var(--slot-border-dark);
    font-size:13px;
    letter-spacing:-1px;
    user-select:none;
  }
  .sidebar-row:last-child{border-bottom:none;}
  .sidebar-row .slot{width:30px; height:30px;}
  .sidebar-row .slot img{width:22px; height:22px;}
  .sidebar-row .sr-info{flex:1; min-width:0;}
  .sidebar-row .sr-name{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-row .sr-label{font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sidebar-row .sr-label b{color:var(--sl-color);}
  .sidebar-row .sr-remove{
    flex-shrink:0;
    width:22px; height:22px;
    border:none;
    background:var(--panel-2);
    color:var(--danger);
    border-radius:50%;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .sidebar-row .sr-remove:hover{background:var(--danger); color:#fff;}

  .sidebar-actions{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .filename-input{
    width:100%;
    padding:9px 10px;
    font-size:13px;
    font-family:'Noto Sans JP', sans-serif;
    background:var(--slot);
    color:var(--text);
    border:2px solid var(--slot-border-dark);
    box-shadow: inset 1px 1px 0 rgba(0,0,0,0.08);
    border-radius:2px;
    outline:none;
  }
  .filename-input:focus{border-color:var(--gold);}

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:26px 16px 40px;
  }
  footer a{color:var(--gold); text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  @media (max-width:900px){
    .layout{flex-direction:column;}
    .sidebar-col{width:100%;}
    .sidebar-list{max-height:40vh;}
  }
  @media (max-width:640px){
    header{padding:32px 16px 24px;}
    thead th{font-size:11px; padding:8px 4px;}
    td{padding:6px 4px; font-size:12px;}
    .item-name .en{display:none;}
    input.qty-input{width:56px;}
    .slot{width:30px;height:30px;}
    .slot img{width:22px;height:22px;}
    .col-img{width:42px;}
    .col-qty{width:66px;}
    .col-sl{width:46px;}
    .col-st{width:46px;}
    .col-ea{width:46px;}
  }


  input[type="text"], input[type="number"]{font-size:16px;}
  @media (max-width:640px){
    input[type="text"], input[type="number"]{font-size:16px;}
    input.qty-input{font-size:16px;}
  }
  ::-webkit-scrollbar{width:10px; height:10px;}

  .page-drop-overlay{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(63,117,48,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .page-drop-overlay.active{display:flex;}
  .page-drop-box{
    border:4px dashed #ffffff;
    border-radius:8px;
    padding:48px 64px;
    color:#ffffff;
    font-size:22px;
    font-weight:700;
    font-family:'Noto Sans JP', sans-serif;
    text-align:center;
  }

  .login-gate{
    position:fixed;
    inset:0;
    z-index:4000;
    background:
      radial-gradient(circle at 20% 0%, #e7ecd9 0%, transparent 45%),
      radial-gradient(circle at 90% 10%, #eef1e3 0%, transparent 40%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .login-box{
    background:var(--panel);
    border:3px solid var(--slot-border-dark);
    border-radius:4px;
    padding:32px 28px;
    max-width:360px;
    width:100%;
    text-align:center;
  }
  .login-box h2{
    font-family:'DotGothic16', monospace;
    color:var(--grass-dark);
    margin:0 0 12px;
    font-size:20px;
  }
  .login-note{
    font-size:11.5px;
    color:var(--text-dim);
    margin:0 0 18px;
    line-height:1.6;
    text-align:left;
  }
  .login-box .filename-input{
    margin-bottom:10px;
    text-align:left;
  }
  .login-error{
    min-height:18px;
    font-size:12.5px;
    color:var(--danger);
    margin-top:10px;
  }

  .history-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(20,24,16,0.55);
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .history-modal.open{display:flex;}
  .history-box{
    background:var(--panel);
    border:3px solid var(--slot-border-dark);
    border-radius:4px;
    max-width:460px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .history-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:2px solid var(--slot-border-light);
  }
  .history-header h2{
    margin:0;
    font-family:'DotGothic16', monospace;
    font-size:17px;
    color:var(--grass-dark);
  }
  .history-close{
    width:26px; height:26px;
    border:none;
    border-radius:50%;
    background:var(--panel-2);
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
  }
  .history-close:hover{background:var(--danger); color:#fff;}
  #historyListArea{
    overflow-y:auto;
    padding:8px 12px 16px;
  }
  .history-empty{
    padding:30px 12px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
  }
  .history-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 6px;
    border-bottom:1px solid #e6e9da;
  }
  .history-row:last-child{border-bottom:none;}
  .history-row .hr-info{flex:1; min-width:0;}
  .history-row .hr-label{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .history-row .hr-meta{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .history-row .hr-actions{display:flex; gap:6px; flex-shrink:0;}

  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--slot-border-light); border-radius:4px;}
</style>
</head>
<body>

<div id="pageDropOverlay" class="page-drop-overlay">
  <div class="page-drop-box">材料リスト(.txt)をここにドロップ</div>
</div>

<div id="loginGate" class="login-gate">
  <div class="login-box">
    <h2>名前を入力</h2>
    <p class="login-note">入力した名前でリストが保存され、次回同じ名前を入れると続きから再開できます。<br>※この端末・ブラウザ内だけで有効です。</p>
    <input type="text" id="loginNameInput" class="filename-input" placeholder="名前" autocomplete="off">
    <button class="btn full" id="loginSubmitBtn">はじめる</button>
    <div id="loginError" class="login-error"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<header>
  <div class="falling-items" id="fallingItems" aria-hidden="true"></div>
  <h1>材料リスト制作サイト</h1>
  <div class="count-badge">ようこそ、<b id="currentUserLabel"></b>さん <button class="btn ghost small" id="switchUserBtn" style="margin-left:8px; vertical-align:middle;">名前を変更</button></div>
</header>

<div class="controlbar">
  <div class="controlbar-inner">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="アイテム名で検索（例：ダイヤモンド、つち、diamond）" autocomplete="off">
      <button type="button" id="searchClearBtn" class="search-clear-btn" aria-label="検索をクリア">×</button>
      <div class="suggest-list" id="suggestList"></div>
    </div>
    <label class="toggle-wrap">
      <input type="checkbox" id="onlyFilledToggle">
      入力済みのみ表示
    </label>
    <button class="btn ghost" id="clearAllBtn">数量を全てクリア</button>
  </div>
</div>

<main>
  <div class="layout">
    <div class="catalog-col">
      <div class="table-shell">
        <table id="itemTable">
          <colgroup>
            <col class="col-img">
            <col class="col-name">
            <col class="col-qty">
            <col class="col-sl">
            <col class="col-st">
            <col class="col-ea">
          </colgroup>
          <thead>
            <tr>
              <th style="width:56px;">画像</th>
              <th class="th-name">アイテム名</th>
              <th style="width:86px;">個数入力</th>
              <th style="width:62px;">SL</th>
              <th style="width:62px;">ST</th>
              <th style="width:62px;">個数</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="sidebar-col">
      <div class="sidebar" id="sidebarPanel">
        <h2>選択リスト</h2>
        <div class="sub"><span id="sidebarCount">0</span> 件選択中</div>
        <input type="file" id="importFileInput" accept=".txt" style="display:none;">
        <button class="btn ghost small full" id="importBtn" style="width:100%; margin-bottom:8px;">材料リスト(.txt)を読み込む(litematicaのみ対応)</button>
        <div id="importStatus" style="display:none; font-size:11px; color:var(--text-dim); margin:-4px 0 8px;"></div>
        <div style="display:flex; gap:6px; margin-bottom:8px;">

.wiki/images/ItemSprite_warped-button.png","yomi":"いがんだぼたん"},{"id":"warped_stairs","ja":"歪んだ階段","en":"Warped Stairs","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-stairs.png","yomi":"いがんだかいだん"},{"id":"warped_stem","ja":"歪んだ幹","en":"Warped Stem","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-stem.png","yomi":"いがんだみき"},{"id":"warped_pressure_plate","ja":"歪んだ感圧板","en":"Warped Pressure Plate","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-pressure-plate.png","yomi":"いがんだかん圧いた"},{"id":"warped_sign","ja":"歪んだ看板","en":"Warped Sign","stack":16,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-sign.png","yomi":"いがんだかんばん"},{"id":"warped_hyphae","ja":"歪んだ菌糸","en":"Warped Hyphae","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-hyphae.png","yomi":"いがんだきんし"},{"id":"warped_roots","ja":"歪んだ根","en":"Warped Roots","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-roots.png","yomi":"いがんだね"},{"id":"warped_shelf","ja":"歪んだ棚","en":"Warped Shelf","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-shelf.png","yomi":"いがんだたな"},{"id":"warped_hanging_sign","ja":"歪んだ吊り看板","en":"Warped Hanging Sign","stack":16,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-hanging-sign.png","yomi":"いがんだつりかんばん"},{"id":"warped_planks","ja":"歪んだ板材","en":"Warped Planks","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_warped-planks.png","yomi":"いがんだいたざい"},{"id":"orange_carpet","ja":"橙色のカーペット","en":"Orange Carpet","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-carpet.png","yomi":"だいだいいろのかーぺっと"},{"id":"orange_concrete","ja":"橙色のコンクリート","en":"Orange Concrete","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-concrete.png","yomi":"だいだいいろのこんくりーと"},{"id":"orange_concrete_powder","ja":"橙色のコンクリートパウダー","en":"Orange Concrete Powder","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-concrete-powder.png","yomi":"だいだいいろのこんくりーとぱうだー"},{"id":"orange_shulker_box","ja":"橙色のシュルカーボックス","en":"Orange Shulker Box","stack":1,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-shulker-box.png","yomi":"だいだいいろのしゅるかーぼっくす"},{"id":"orange_tulip","ja":"橙色のチューリップ","en":"Orange Tulip","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-tulip.png","yomi":"だいだいいろのちゅーりっぷ"},{"id":"orange_terracotta","ja":"橙色のテラコッタ","en":"Orange Terracotta","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-terracotta.png","yomi":"だいだいいろのてらこった"},{"id":"orange_harness","ja":"橙色のハーネス","en":"Orange Harness","stack":1,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-harness.png","yomi":"だいだいいろのはーねす"},{"id":"orange_bundle","ja":"橙色のバンドル","en":"Orange Bundle","stack":1,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-bundle.png","yomi":"だいだいいろのばんどる"},{"id":"orange_bed","ja":"橙色のベッド","en":"Orange Bed","stack":1,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-bed.png","yomi":"だいだいいろのべっど"},{"id":"orange_candle","ja":"橙色のろうそく","en":"Orange Candle","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-candle.png","yomi":"だいだいいろのろうそく"},{"id":"orange_banner","ja":"橙色の旗","en":"Orange Banner","stack":16,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-banner.png","yomi":"だいだいいろのはた"},{"id":"orange_glazed_terracotta","ja":"橙色の彩釉テラコッタ","en":"Orange Glazed Terracotta","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-glazed-terracotta.png","yomi":"だいだいいろのいろどり釉てらこった"},{"id":"orange_stained_glass","ja":"橙色の色付きガラス","en":"Orange Stained Glass","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-stained-glass.png","yomi":"だいだいいろのいろつきがらす"},{"id":"orange_stained_glass_pane","ja":"橙色の色付きガラス板","en":"Orange Stained Glass Pane","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-stained-glass-pane.png","yomi":"だいだいいろのいろつきがらすいた"},{"id":"orange_dye","ja":"橙色の染料","en":"Orange Dye","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-dye.png","yomi":"だいだいいろのせんりょう"},{"id":"orange_wool","ja":"橙色の羊毛","en":"Orange Wool","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_orange-wool.png","yomi":"だいだいいろのようもう"},{"id":"smoker","ja":"燻製器","en":"Smoker","stack":64,"img":"https://ja.minecraft.wiki/images/ItemSprite_smoker.png","yomi":"くんせいき"}]</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById('itemData').textContent);
  const SHULKER_SLOTS = 27;

  const quantities = Object.create(null);
  const selectedOrder = [];

  const byId = Object.create(null);
  for (const it of DATA) byId[it.id] = it;

  const tableBody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const suggestList = document.getElementById('suggestList');
  const onlyFilledToggle = document.getElementById('onlyFilledToggle');
  const sidebarList = document.getElementById('sidebarList');
  const sidebarCount = document.getElementById('sidebarCount');

  function breakdown(qty, stack){
    if(stack <= 1){
      return {sl: 0, st: 0, ea: qty};
    }
    const cap = SHULKER_SLOTS * stack;
    const sl = Math.floor(qty / cap);
    const rem1 = qty % cap;
    const st = Math.floor(rem1 / stack);
    const ea = rem1 % stack;
    return {sl, st, ea};
  }

  function labelParts(item, qty){
    if(!qty || qty <= 0) return [];
    const {sl, st, ea} = breakdown(qty, item.stack);
    const parts = [];
    if(sl > 0) parts.push(sl + 'sl');
    if(st > 0) parts.push(st + 'st');
    if(ea > 0 || parts.length === 0) parts.push(String(ea));
    return parts;
  }

  function labelText(item, qty){
    const parts = labelParts(item, qty);
    if(parts.length === 0) return '';
    return item.ja + ':' + parts.join('+');
  }

  function labelTextShort(item, qty){
    const parts = labelParts(item, qty);
    return parts.join('+');
  }

  function katakanaToHiragana(str){
    return str.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  }

  const ROMAJI_MAP = {
    a:'あ', i:'い', u:'う', e:'え', o:'お',
    ka:'か', ki:'き', ku:'く', ke:'け', ko:'こ',
    ga:'が', gi:'ぎ', gu:'ぐ', ge:'げ', go:'ご',
    sa:'さ', shi:'し', si:'し', su:'す', se:'せ', so:'そ',
    za:'ざ', ji:'じ', zi:'じ', zu:'ず', ze:'ぜ', zo:'ぞ',
    ta:'た', chi:'ち', ti:'ち', tsu:'つ', tu:'つ', te:'て', to:'と',
    da:'だ', di:'ぢ', du:'づ', de:'で', do:'ど',
    na:'な', ni:'に', nu:'ぬ', ne:'ね', no:'の',
    ha:'は', hi:'ひ', fu:'ふ', hu:'ふ', he:'へ', ho:'ほ',
    ba:'ば', bi:'び', bu:'ぶ', be:'べ', bo:'ぼ',
    pa:'ぱ', pi:'ぴ', pu:'ぷ', pe:'ぺ', po:'ぽ',
    ma:'ま', mi:'み', mu:'む', me:'め', mo:'も',
    ya:'や', yu:'ゆ', yo:'よ',
    ra:'ら', ri:'り', ru:'る', re:'れ', ro:'ろ',
    wa:'わ', wo:'を', vu:'ゔ',
    kya:'きゃ', kyu:'きゅ', kyo:'きょ',
    gya:'ぎゃ', gyu:'ぎゅ', gyo:'ぎょ',
    sha:'しゃ', sya:'しゃ', shu:'しゅ', syu:'しゅ', sho:'しょ', syo:'しょ',
    ja:'じゃ', zya:'じゃ', ju:'じゅ', zyu:'じゅ', jo:'じょ', zyo:'じょ',
    cha:'ちゃ', tya:'ちゃ', chu:'ちゅ', tyu:'ちゅ', cho:'ちょ', tyo:'ちょ',
    nya:'にゃ', nyu:'にゅ', nyo:'にょ',
    hya:'ひゃ', hyu:'ひゅ', hyo:'ひょ',
    bya:'びゃ', byu:'びゅ', byo:'びょ',
    pya:'ぴゃ', pyu:'ぴゅ', pyo:'ぴょ',
    mya:'みゃ', myu:'みゅ', myo:'みょ',
    rya:'りゃ', ryu:'りゅ', ryo:'りょ',
  };

  function romajiToHiragana(str){
    const s = str.toLowerCase();
    let out = '';
    let i = 0;
    while(i < s.length){
      const c = s[i];
      if(c !== 'n' && /[a-z]/.test(c) && s[i+1] === c && !'aeiou'.includes(c)){
        out += 'っ';
        i += 1;
        continue;
      }
      let matched = false;
      for(let len = 3; len >= 1; len--){
        const chunk = s.substr(i, len);
        if(ROMAJI_MAP[chunk]){
          out += ROMAJI_MAP[chunk];
          i += len;
          matched = true;
          break;
        }
      }
      if(matched) continue;
      if(c === 'n'){
        out += 'ん';
        i += 1;
      } else if(c === '-'){
        out += 'ー';
        i += 1;
      } else {
        out += c;
        i += 1;
      }
    }
    return out;
  }

  function haystack(item){
    if(!item._hay){
      const normalizedJa = katakanaToHiragana(item.ja);
      item._hay = (normalizedJa + ' ' + item.en + ' ' + (item.yomi||'') + ' ' + item.id).toLowerCase();
    }
    return item._hay;
  }

  function matches(item, q){
    if(haystack(item).indexOf(q) !== -1) return true;
    const qHira = romajiToHiragana(q);
    if(qHira !== q && item.yomi && item.yomi.indexOf(qHira) !== -1) return true;
    return false;
  }

  function rankScore(item, q){
    const ja = item.ja.toLowerCase();
    const en = item.en.toLowerCase();
    const yomi = (item.yomi||'').toLowerCase();
    const qHira = romajiToHiragana(q);
    if(ja.startsWith(q) || en.startsWith(q) || yomi.startsWith(q) || (qHira !== q && yomi.startsWith(qHira))) return 0;
    return 1;
  }

  function currentQuery(){
    return searchInput.value.trim().toLowerCase();
  }

  let exactMatchId = null;

  function getFilteredList(){
    let list;
    if(exactMatchId !== null){
      list = DATA.filter(it => it.id === exactMatchId);
    } else {
      const q = currentQuery();
      list = q ? DATA.filter(it => matches(it, q)) : DATA;
    }
    if(onlyFilledToggle.checked){
      list = list.filter(it => (quantities[it.id] || 0) > 0);
    }
    return list;
  }

  function lockToItem(item){
    exactMatchId = item.id;
    searchInput.value = item.ja;
    updateSearchClearBtn();
    suggestList.classList.remove('open');
    render();
    const row = tableBody.querySelector('tr[data-id="' + CSS.escape(item.id) + '"]');
    if(row){
      row.scrollIntoView({behavior:'smooth', block:'center'});
      const inp = row.querySelector('.qty-input');
      if(inp) inp.focus();
    }
  }

  function rowHtml(item){
    const qty = quantities[item.id] || 0;
    const {sl, st, ea} = breakdown(qty, item.stack);
    const hasQty = qty > 0;
    const slCls = sl > 0 ? 'val-sl' : 'val-zero';
    const stCls = st > 0 ? 'val-st' : 'val-zero';
    const eaCls = qty > 0 ? 'val-ea' : 'val-zero';
    return (
      '<tr class="' + (hasQty ? 'has-qty' : '') + '" data-id="' + item.id + '">' +
        '<td><div class="slot"><img crossorigin="anonymous" src="' + item.img + '" alt="' + item.ja + '"></div></td>' +
        '<td class="td-name"><span class="item-name"><span class="ja">' + item.ja + '</span><span class="en">' + item.en + '</span></span></td>' +
        '<td><input type="number" min="0" step="1" class="qty-input" value="' + (qty || '') + '" placeholder="0" data-id="' + item.id + '"></td>' +
        '<td class="' + slCls + '">' + sl + '</td>' +
        '<td class="' + stCls + '">' + st + '</td>' +
        '<td class="' + eaCls + '">' + ea + '</td>' +
      '</tr>'
    );
  }

  function render(){
    const list = getFilteredList();
    if(list.length === 0){
      tableBody.innerHTML = '<tr class="empty-row"><td colspan="6">該当するアイテムが見つかりません</td></tr>';
    } else {
      tableBody.innerHTML = list.map(rowHtml).join('');
    }
  }

  function sidebarRowHtml(item){
    const qty = quantities[item.id] || 0;
    return (
      '<div class="sidebar-row" data-id="' + item.id + '" draggable="true">' +
        '<span class="sr-grip">⠿</span>' +
        '<div class="slot"><img crossorigin="anonymous" src="' + item.img + '" alt="' + item.ja + '"></div>' +
        '<div class="sr-info">' +
          '<div class="sr-name">' + item.ja + '</div>' +
          '<div class="sr-label">' + qty.toLocaleString('ja-JP') + '個 → <b>' + labelTextShort(item, qty) + '</b></div>' +
        '</div>' +
        '<button class="sr-remove" data-remove="' + item.id + '" title="削除">×</button>' +
      '</div>'
    );
  }

  function renderSidebar(){
    sidebarCount.textContent = selectedOrder.length.toLocaleString('ja-JP');
    if(selectedOrder.length === 0){
      sidebarList.innerHTML = '<div class="sidebar-empty">アイテムに個数を入力すると<br>ここに追加されます</div>';
    } else {
      sidebarList.innerHTML = selectedOrder.map(id => sidebarRowHtml(byId[id])).join('');
    }
    updateExtraFilenameInputs();
    saveUserState();
  }

  function setQuantityRaw(id, newQty){
    let v = parseInt(newQty, 10);
    if(isNaN(v) || v < 0) v = 0;
    const wasSelected = (quantities[id] || 0) > 0;
    quantities[id] = v;
    const isSelected = v > 0;
    if(isSelected && !wasSelected){
      selectedOrder.push(id);
    } else if(!isSelected && wasSelected){
      const idx = selectedOrder.indexOf(id);
      if(idx !== -1) selectedOrder.splice(idx, 1);
    }
    return v;
  }

  function updateQuantity(id, newQty){
    const v = setQuantityRaw(id, newQty);

    const row = tableBody.querySelector('tr[data-id="' + CSS.escape(id) + '"]');
    if(row){
      const item = byId[id];
      const {sl, st, ea} = breakdown(v, item.stack);
      const inp = row.querySelector('.qty-input');
      if(inp && document.activeElement !== inp) inp.value = v || '';
      row.classList.toggle('has-qty', v > 0);
      const cells = row.querySelectorAll('td');
      cells[3].textContent = sl; cells[3].className = sl>0 ? 'val-sl' : 'val-zero';
      cells[4].textContent = st; cells[4].className = st>0 ? 'val-st' : 'val-zero';
      cells[5].textContent = ea; cells[5].className = v>0 ? 'val-ea' : 'val-zero';
    }
    if(onlyFilledToggle.checked) render();

    renderSidebar();
  }

  tableBody.addEventListener('input', function(e){
    const t = e.target;
    if(t.classList.contains('qty-input')){
      updateQuantity(t.getAttribute('data-id'), t.value);
    }
  });

  sidebarList.addEventListener('click', function(e){
    const btn = e.target.closest('.sr-remove');
    if(!btn) return;
    updateQuantity(btn.getAttribute('data-remove'), 0);
  });

  let dragSourceId = null;
  const sidebarPanel = document.getElementById('sidebarPanel');

  function clearDragIndicators(){
    sidebarList.querySelectorAll('.sidebar-row').forEach(el => {
      el.classList.remove('drag-over-top', 'drag-over-bottom');
    });
  }

  sidebarList.addEventListener('dragstart', function(e){
    const row = e.target.closest('.sidebar-row');
    if(!row) return;
    dragSourceId = row.getAttribute('data-id');
    row.classList.add('dragging');
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragSourceId); } catch(err){}
    }
  });

  sidebarList.addEventListener('dragend', function(e){
    const row = e.target.closest('.sidebar-row');
    if(row) row.classList.remove('dragging');
    dragSourceId = null;
    clearDragIndicators();
  });

  sidebarList.addEventListener('dragover', function(e){
    if(!dragSourceId) return;
    const row = e.target.closest('.sidebar-row');
    if(!row || row.getAttribute('data-id') === dragSourceId) return;
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    const rect = row.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    clearDragIndicators();
    row.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
  });

  sidebarList.addEventListener('drop', function(e){
    if(!dragSourceId) return;
    const row = e.target.closest('.sidebar-row');
    clearDragIndicators();
    if(!row) return;
    e.preventDefault();
    const targetId = row.getAttribute('data-id');
    if(targetId === dragSourceId) return;

    const fromIdx = selectedOrder.indexOf(dragSourceId);
    if(fromIdx === -1) return;
    selectedOrder.splice(fromIdx, 1);

    const rect = row.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    let toIdx = selectedOrder.indexOf(targetId);

    } else {

  function measureLayout(ids){
    let maxName = 40, maxLabel = 30;
    for(const id of ids){
      const item = byId[id];
      const qty = quantities[id] || 0;
      measureCtx.font = NAME_FONT;
      maxName = Math.max(maxName, measureCtx.measureText(item.ja).width);
      measureCtx.font = LABEL_FONT;
      maxLabel = Math.max(maxLabel, measureCtx.measureText(labelTextShort(item, qty)).width);
    }
    return {maxName, maxLabel};
  }

  function drawSelectionCanvas(ids, layout){
    const scale = 2;
    const rowH = 52;
    const padX = 18;
    const padTop = 14;
    const padBottom = 14;
    const imgBox = 38;
    const gapAfterImg = 14;
    const gapBeforeLabel = 28;
    const width = padX + imgBox + gapAfterImg + layout.maxName + gapBeforeLabel + layout.maxLabel + padX;
    const height = padTop + ids.length * rowH + padBottom;

    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(width * scale);
    canvas.height = Math.ceil(height * scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = '#9a9f89';
    ctx.lineWidth = 3;
    ctx.strokeRect(1.5, 1.5, width - 3, height - 3);

    let y = padTop;
    for (const id of ids) {
      const item = byId[id];
      const qty = quantities[id] || 0;

      ctx.strokeStyle = '#e6e9da';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padX, y);
      ctx.lineTo(width - padX, y);
      ctx.stroke();

      const cy = y + rowH / 2;
      ctx.textBaseline = 'middle';

      const slotX = padX, slotY = y + (rowH - imgBox) / 2;
      ctx.fillStyle = '#8b8b8b';
      ctx.fillRect(slotX, slotY, imgBox, imgBox);
      ctx.strokeStyle = '#373737';
      ctx.strokeRect(slotX + 0.5, slotY + 0.5, imgBox - 1, imgBox - 1);
      const imgEl = document.querySelector('.sidebar-row[data-id="' + CSS.escape(id) + '"] img');
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        const pad = 5;
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(imgEl, slotX + pad, slotY + pad, imgBox - pad * 2, imgBox - pad * 2);
      }

      const nameX = padX + imgBox + gapAfterImg;
      ctx.fillStyle = '#262b1f';
      ctx.font = NAME_FONT;
      ctx.textAlign = 'left';
      ctx.fillText(item.ja, nameX, cy);

      ctx.fillStyle = '#3f7530';
      ctx.font = LABEL_FONT;
      ctx.textAlign = 'right';
      ctx.fillText(labelTextShort(item, qty), width - padX, cy);
      ctx.textAlign = 'left';

      y += rowH;
    }

    return canvas;
  }

  function canvasToBlob(canvas){
    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  function chunkFilename(i, chunks, baseName, useExtra, extraInputs){
    if(i === 0){
      return baseName;
    }
    if(useExtra){
      const val = extraInputs[i - 1] ? extraInputs[i - 1].value.trim() : '';
      if(val) return sanitizeFilename(val);
    }
    return baseName.replace(/\d+$/, '') + (i + 1);
  }

  async function downloadSelectionImages(){
    const layout = measureLayout(selectedOrder);
    const chunks = [];
    for(let i = 0; i < selectedOrder.length; i += ROWS_PER_IMAGE){
      chunks.push(selectedOrder.slice(i, i + ROWS_PER_IMAGE));
    }
    const useExtra = extraFilenameToggle.checked && chunks.length > 1;
    const extraInputs = useExtra ? Array.from(extraFilenameContainer.querySelectorAll('input')) : [];
    const baseName = resolveFilenameFor(filenameInput);

    if(zipToggle.checked && typeof JSZip !== 'undefined'){
      const zip = new JSZip();
      for(let i = 0; i < chunks.length; i++){
        const canvas = drawSelectionCanvas(chunks[i], layout);
        const filename = chunkFilename(i, chunks, baseName, useExtra, extraInputs);
        const blob = await canvasToBlob(canvas);
        zip.file(filename + '.png', blob);
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const zipVal = zipFilenameInput.value.trim();
      const zipName = zipVal ? sanitizeFilename(zipVal) : '材料リストまとめ';
      const url = URL.createObjectURL(zipBlob);
      const link = document.createElement('a');
      link.download = zipName + '.zip';
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return;
    }

    for(let i = 0; i < chunks.length; i++){
      const canvas = drawSelectionCanvas(chunks[i], layout);
      const filename = chunkFilename(i, chunks, baseName, useExtra, extraInputs);
      const link = document.createElement('a');
      link.download = filename + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      if(i < chunks.length - 1){
        await new Promise(resolve => setTimeout(resolve, 400));
      }
    }
  }

  function attemptLogin(){
    const name = loginNameInput.value.trim();
    loginError.textContent = '';
    if(!name){
      loginError.textContent = '名前を入力してください。';
      return;
    }
    currentUserName = name;
    for(const k in quantities) delete quantities[k];
    selectedOrder.length = 0;
    loadUserState(name);
    loginGate.style.display = 'none';
    startApp();
  }

  loginSubmitBtn.addEventListener('click', attemptLogin);
  loginNameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') attemptLogin();
  });

  switchUserBtn.addEventListener('click', function(){
    appRoot.style.display = 'none';
    loginGate.style.display = 'flex';
    loginNameInput.value = '';
    loginError.textContent = '';
    loginNameInput.focus();
  });

  loginNameInput.focus();
})();
</script>

</body>
</html>
